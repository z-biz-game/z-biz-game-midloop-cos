name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install：这仓零运行时依赖，为了证明「什么都没装」而往 CI 里拉一个浏览器或打包器，
      # 换来的只是下一次网络抖动时的红。
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          for f in $(git ls-files 'tools/*.mjs' tools/scenarios.js tools/playtest.cjs); do node --check "$f" || exit 1; done

      # 判据 1 + 判据 2 的正面证据，加上三组对照（0 解 / 8 解 / 独立环枚举的金标准）。
      # 纯 node，不需要浏览器，所以每一次 merge 前它都在。
      - name: Engine tests
        run: node tools/engine-test.mjs

      # README 印出去的每一个「现值」都等于代码/脚本里的现在值：档位表、十条规则名、
      # 腿 × 形态的闸形状、端口、节点预算、SAMPLES 旋钮。散文没有闸读就会一直抄到上一个世界。
      - name: Docs are asserted surface
        run: node tools/doctest.mjs

      # 尺寸菜单是被量出来的，不是配的：这一步复测出货档的节点数与越预算候选数，
      # 并检查越线的档还挂在 TOO_EXPENSIVE 上、且带着它自己的实测读数。
      - name: Size menu and hardness are still measured
        run: node tools/balance.mjs

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html && grep -q 'ミッドループ' index.html

  # 真浏览器闸：headless Chrome + 裸 CDP，读 DOM 文本/几何、画布像素与真实输入事件，不读内部标志位。
  # 独立 job、node 22 而不是 check job 的 20：台架用 Node 22 才有的全局 WebSocket/fetch，
  # 在 20 上第一次 attach 就死在 "WebSocket is not defined"，一条断言都跑不到。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # verify.sh 自己起**两个** server：5281 的根 / （本地开发那个形态）与 5282 上的
      # /z-biz-game-midloop-cos/ 前缀形态。前缀不是同一个 server 顺手兜底兜出来的——
      # 它挂在一个只放着软链的根目录上，所以线上会因为写死绝对路径而 404 的写法在这里一样红。
      # 两种形态各跑同一套场景，条数逐条相同才算绿。
      - name: Browser gate, both local URL shapes
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # 阴性自证：闸必须能被证明「会红」。每一份报告都要点名吃下自己种下的那条错期望，
      # 报告份数由 LEGS 当场算出来的分母核对——少一份就是有腿没跑，光看 rc≠0 分不清这两件事。
      - name: Gate proves it can fail
        env:
          WD_TIMEOUT: 900
        run: |
          set +e
          GATE_SELFTEST=1 bash tools/verify.sh > _tmp-selftest.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc"
          tail -25 _tmp-selftest.log; grep -E '应有|点名吃下|ok 闸|RED' _tmp-selftest.log | tail -8
          [ "$rc" -ne 0 ] || { echo "SELFTEST 竟然全绿：这个闸证明不了自己会红"; exit 1; }
          grep -q 'FAIL' _tmp-selftest.log || { echo "SELFTEST 红了但没有点名是哪条断言"; exit 1; }
